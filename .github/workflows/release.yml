# GitHub Actions workflow for creating draft releases after successful builds.
# This workflow is triggered automatically when the Build workflow completes successfully on the main branch.
# It is split into two jobs:
#   - `gate`: computes the Gradle version and checks whether the v<VERSION> tag already exists on origin.
#             Emits a ::warning:: annotation on the documented post-merge rerun path and skips the release.
#   - `release`: runs only when the tag does not exist. Downloads the plugin artifact, creates a draft
#                GitHub release, uploads the artifact, patches CHANGELOG.md against the release note,
#                and opens a PR targeting main.
#
# The workflow is triggered on workflow_run events from the Build workflow.
#
# GitHub Actions reference: https://docs.github.com/actions

name: Release
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  # Compute the Gradle version and emit a ::warning:: if the v<VERSION> tag already exists on origin.
  gate:
    name: Check Release Tag
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      should_release: ${{ steps.check_existing_tag.outputs.should_release }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Compute VERSION once and publish to $GITHUB_OUTPUT for downstream jobs
      - name: Compute Version
        id: compute_version
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Skip the draft when a tag for this version already exists on origin.
      - name: Check Existing Release Tag
        id: check_existing_tag
        env:
          VERSION: ${{ steps.compute_version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION$"; then
            echo "::warning::Tag v$VERSION already exists on origin; a release was already produced for this version. Update the version in `gradle.properties`."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Create a draft release after a successful Build workflow when the v<VERSION> tag is absent.
  release:
    name: Create Draft Release
    needs: gate
    if: ${{ needs.gate.result == 'success' && needs.gate.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up build environment with read-only cache
      - name: Setup Build Environment
        uses: ./.github/workflows/actions/setup-build-environment
        with:
          cache-read-only: true

      # Download the plugin artifact from the completed Build workflow
      - name: Download Plugin Artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: ./build/distributions
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Remove old release drafts by using the curl request for the available releases with a draft flag.
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=$RELEASE_NOTE

          gh release create v${{ needs.gate.outputs.version }} \
            --draft \
            --title v${{ needs.gate.outputs.version }} \
            --notes-file $RELEASE_NOTE

      # Upload the plugin artifact to the draft release
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ needs.gate.outputs.version }} ./build/distributions/*

      # Replace the [Unreleased] section of CHANGELOG.md with the release note
      - name: Patch Changelog
        run: ./gradlew patchChangelog --release-note-file=./build/tmp/release_note.txt

      # Open a PR targeting main with the patched CHANGELOG.md.
      # Branch off origin/main explicitly so the PR's diff against main only
      # contains CHANGELOG.md (and gradle.properties if the changelog plugin
      # bumped the version)
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Changelog update for release ${{ needs.gate.outputs.version }}"
          title: "Changelog update for release `v${{ needs.gate.outputs.version }}`"
          body: |
            Current pull request contains patched `CHANGELOG.md` file for the `v${{ needs.gate.outputs.version }}` version. Merging this PR triggers the `Publish` workflow, which publishes the release to the [JetBrains Marketplace](https://plugins.jetbrains.com).
          branch: changelog-update-${{ needs.gate.outputs.version }}
          base: main
          labels: release changelog
          delete-branch: true
