name: 'Setup Build Environment'
description: 'Sets up the build environment by maximising disk space, checking out sources, and configuring Java and Gradle'

inputs:
  cache-read-only:
    description: 'Whether to configure Gradle cache as read-only (prevents cache updates)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Maximize Build Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
