name: 'Setup Build Environment'
description: 'Sets up the build environment by maximising disk space, checking out sources, and configuring Java and Gradle'

inputs:
  cache-read-only:
    description: 'Whether to configure Gradle cache as read-only (prevents cache updates)'
    required: false
    default: 'false'
  ref:
    description: 'Git reference to checkout (branch, tag, or SHA). Leave empty for default branch.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Maximize Build Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false
        large-packages: false

    - name: Fetch Sources
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref }}

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
