# GitHub Actions Workflow for publishing the plugin.
#
# Triggers:
# - `push` on `v*` tags: created by the `Create Tag` workflow when the
#   `Changelog update` PR is merged.
# - `workflow_dispatch`: manual trigger for re-runs and recovery; accepts an
#   optional `version` input. Leave blank to publish the latest draft.
#
# Responsibilities:
# - Publish the plugin to JetBrains Marketplace.
# - Convert the matching draft release to a published release.
#
# Running the publishPlugin task requires all the following secrets to be provided:
# PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g., 1.0.0). Leave empty to use latest draft release.'
        required: false
        default: ''

jobs:

  # Publish the plugin to JetBrains Marketplace and convert draft to published release
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up build environment with read-only cache
      - name: Setup Build Environment
        uses: ./.github/workflows/actions/setup-build-environment
        with:
          cache-read-only: true

      # Determine the version to publish. For tag pushes, take it from
      # `github.ref_name` (e.g. `v1.2.3` -> `1.2.3`). For workflow_dispatch,
      # use the explicit input if provided, otherwise resolve to the latest
      # draft release.
      - name: Get Version
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Find the latest draft release
            VERSION=$(gh api repos/{owner}/{repo}/releases \
              --jq '.[] | select(.draft == true) | .tag_name' \
              | head -n 1)
            if [ -z "$VERSION" ]; then
              echo "Error: No draft release found. Please create a draft release first using the Release workflow."
              exit 1
            fi
            # Draft tag name has the v<VERSION> scheme; strip the prefix.
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version to publish: $VERSION"

      # Check out at the release tag (overrides the default checkout from composite action)
      - name: Fetch Sources at Tag
        uses: actions/checkout@v6
        with:
          ref: v${{ steps.get_version.outputs.version }}

      # Verify the matching draft release exists and is still a draft. Refuses
      # to publish against manually pushed tags with no draft and skips when
      # the release has already been published (idempotent re-runs).
      - name: Verify Release State
        id: verify_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          RELEASE_JSON=$(gh api "repos/{owner}/{repo}/releases/tags/v$VERSION" 2>/dev/null || true)
          if [ -z "$RELEASE_JSON" ]; then
            echo "Error: No release found for tag v$VERSION. Tags must be created via the Create Tag workflow."
            exit 1
          fi
          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.draft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::warning::Release v$VERSION is no longer a draft; skipping publish (already published)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin to JetBrains Marketplace
        id: publish_marketplace
        if: ${{ steps.verify_release.outputs.should_publish == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then
            ./gradlew publishPlugin
          else
            echo "::warning::PUBLISH_TOKEN secret is not set. Plugin was not published to JetBrains Marketplace."
          fi

      # Convert the draft release created by release.yml to a published release.
      - name: Publish GitHub Release
        if: ${{ steps.publish_marketplace.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false
