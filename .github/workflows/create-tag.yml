# GitHub Actions workflow that creates an annotated release tag when the
# `Changelog update` PR is merged into `main`.
#
# This workflow is the sole creator of release tags. Tags use the `v<VERSION>`
# scheme (e.g., version `1.0.0` -> tag `v1.0.0`) and are annotated with the
# release notes as the tag message. The matching draft GitHub release is
# produced by `release.yml`; `publish.yml` consumes the tag and flips the
# draft to a public release.
#
# Trigger: `pull_request: closed`, gated on merge + branch-name pattern, so
# closed-without-merge PRs are ignored.

name: Create Tag

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  # Keyed on the workflow and the changelog branch so that two changelog
  # PRs merging back-to-back cannot race on the same tag.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create Release Tag
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'changelog-update-')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read Version
        id: read_version
        run: |
          VERSION=$(grep -E '^version[[:space:]]*=' gradle.properties \
            | head -n 1 \
            | cut -d'=' -f2- \
            | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Error: could not read 'version' from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Read Release Notes
        id: read_release_notes
        run: |
          VERSION="${{ steps.read_version.outputs.version }}"
          NOTES_FILE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$NOTES_FILE")"

          # The `Changelog update` PR was merged, so `## [Unreleased]` has
          # been replaced by `## [<VERSION>]`. `getChangelog --unreleased`
          # would return nothing here, so extract the section directly from
          # CHANGELOG.md. This guarantees the tag message matches the
          # draft release body produced by `release.yml`. Match on the
          # `## [<VERSION>]` prefix so any trailing date suffix is kept.
          awk -v ver="[$VERSION]" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              prefix = "## " ver
              head = substr($0, 1, length(prefix))
              if (head == prefix) { capture = 1; print; next }
            }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "Error: release notes for version $VERSION not found in CHANGELOG.md"
            exit 1
          fi
          echo "Release notes extracted for version $VERSION"

      - name: Create Annotated Tag
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          TAG="v$VERSION"

          # Skip cleanly if the tag already exists remotely (e.g., a re-run
          # of this workflow).
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git tag -a "$TAG" -F ./build/tmp/release_note.txt
          git push origin "$TAG"
          echo "Tag $TAG created and pushed."
